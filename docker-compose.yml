services:
  kanso:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    # 构建模式下用本地 kanso:local；升级脚本会通过 KANSO_IMAGE 指定已发布镜像
    image: ${KANSO_IMAGE:-kanso:local}
    container_name: kanso
    restart: unless-stopped
    ports:
      - "${KANSO_PORT:-8080}:8080"
    environment:
      KANSO_ADDR: ":8080"
      # 可用 `openssl rand -hex 32` 生成随机访问密钥
      KANSO_ACCESS_KEY: ${KANSO_ACCESS_KEY:-change-me}
      KANSO_DATA_DIR: /data
      KANSO_CONFIG_FILE: /data/kanso-config.json
      KANSO_MODE: ${KANSO_MODE:-personal}
      KANSO_WS_ORIGINS: ${KANSO_WS_ORIGINS:-}
    volumes:
      - kanso-data:/data

volumes:
  kanso-data:
